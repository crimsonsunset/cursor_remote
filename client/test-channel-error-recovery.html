<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Channel Error 恢复测试</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #f8fafc;
        }
        .container {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        .test-section {
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
        }
        .test-title {
            color: #1e293b;
            margin-bottom: 16px;
            font-size: 18px;
            font-weight: 600;
        }
        .btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
            transition: all 0.2s;
        }
        .btn:hover {
            background: #2563eb;
            transform: translateY(-1px);
        }
        .btn-success {
            background: #10b981;
        }
        .btn-success:hover {
            background: #059669;
        }
        .btn-warning {
            background: #f59e0b;
        }
        .btn-warning:hover {
            background: #d97706;
        }
        .btn-danger {
            background: #ef4444;
        }
        .btn-danger:hover {
            background: #dc2626;
        }
        .log {
            background: #1e293b;
            color: #e2e8f0;
            padding: 16px;
            border-radius: 6px;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 13px;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
            margin: 16px 0;
        }
        .status {
            padding: 8px 16px;
            border-radius: 6px;
            margin: 8px 0;
            font-weight: 500;
        }
        .status.success {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
        }
        .status.error {
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }
        .status.info {
            background: #eff6ff;
            color: #1e40af;
            border: 1px solid #dbeafe;
        }
        .test-results {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }
        .result-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 16px;
        }
        .result-title {
            font-weight: 600;
            margin-bottom: 8px;
            color: #374151;
        }
        .metric {
            display: flex;
            justify-content: space-between;
            margin: 4px 0;
            font-size: 14px;
        }
        .metric-value {
            font-weight: 500;
            color: #059669;
        }
    </style>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="env-config.js"></script>
</head>
<body>
    <div class="container">
        <h1>🔧 Channel Error 恢复机制测试</h1>
        <p>此页面用于测试和验证客户端在遇到channel error时的恢复能力。</p>
    </div>

    <div class="container">
        <div class="test-section">
            <h2 class="test-title">🔌 连接测试</h2>
            <button class="btn" onclick="initializeConnection()">初始化连接</button>
            <button class="btn btn-success" onclick="testBasicConnection()">测试基本连接</button>
            <button class="btn btn-warning" onclick="testChannelSubscription()">测试Channel订阅</button>
            <div id="connection-status" class="status info">等待测试...</div>
        </div>

        <div class="test-section">
            <h2 class="test-title">📨 命令发送与恢复测试</h2>
            <button class="btn" onclick="sendTestCommand()">发送测试命令</button>
            <button class="btn btn-success" onclick="simulateChannelError()">模拟Channel Error</button>
            <button class="btn btn-warning" onclick="testFallbackRecovery()">测试Fallback恢复</button>
            <button class="btn btn-danger" onclick="testManualRecovery()">测试手动恢复</button>
            <div id="command-status" class="status info">等待测试...</div>
        </div>

        <div class="test-section">
            <h2 class="test-title">🔄 恢复功能测试</h2>
            <button class="btn btn-success" onclick="testRecoveryFunction()">测试结果恢复功能</button>
            <button class="btn btn-warning" onclick="testPageRefresh()">测试页面刷新恢复</button>
            <button class="btn" onclick="clearTestData()">清理测试数据</button>
            <div id="recovery-status" class="status info">等待测试...</div>
        </div>
    </div>

    <div class="container">
        <h2>📊 测试结果</h2>
        <div class="test-results">
            <div class="result-card">
                <div class="result-title">连接状态</div>
                <div class="metric">
                    <span>Supabase连接:</span>
                    <span id="supabase-connection" class="metric-value">未测试</span>
                </div>
                <div class="metric">
                    <span>Channel订阅:</span>
                    <span id="channel-subscription" class="metric-value">未测试</span>
                </div>
            </div>
            
            <div class="result-card">
                <div class="result-title">恢复机制</div>
                <div class="metric">
                    <span>Fallback查询:</span>
                    <span id="fallback-query" class="metric-value">未测试</span>
                </div>
                <div class="metric">
                    <span>手动恢复:</span>
                    <span id="manual-recovery" class="metric-value">未测试</span>
                </div>
            </div>
            
            <div class="result-card">
                <div class="result-title">测试统计</div>
                <div class="metric">
                    <span>发送命令数:</span>
                    <span id="commands-sent" class="metric-value">0</span>
                </div>
                <div class="metric">
                    <span>成功恢复数:</span>
                    <span id="commands-recovered" class="metric-value">0</span>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <h2>📝 测试日志</h2>
        <div id="test-log" class="log">等待开始测试...\n</div>
    </div>

    <script>
        let supabaseClient;
        let testStats = {
            commandsSent: 0,
            commandsRecovered: 0,
            testResults: {}
        };

        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const logElement = document.getElementById('test-log');
            const prefix = type === 'error' ? '❌' : type === 'success' ? '✅' : type === 'warning' ? '⚠️' : 'ℹ️';
            logElement.textContent += `[${timestamp}] ${prefix} ${message}\n`;
            logElement.scrollTop = logElement.scrollHeight;
            console.log(`[${type.toUpperCase()}] ${message}`);
        }

        function updateStatus(elementId, message, type = 'info') {
            const element = document.getElementById(elementId);
            if (element) {
                element.textContent = message;
                element.className = `status ${type}`;
            }
        }

        function updateMetric(metricId, value) {
            const element = document.getElementById(metricId);
            if (element) {
                element.textContent = value;
            }
        }

        async function initializeConnection() {
            log('开始初始化Supabase连接...');
            updateStatus('connection-status', '正在初始化连接...', 'info');
            
            try {
                if (typeof window.SUPABASE_URL === 'undefined' || typeof window.SUPABASE_ANON_KEY === 'undefined') {
                    throw new Error('Supabase配置缺失，请检查 env-config.js 文件');
                }
                
                supabaseClient = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
                log('Supabase客户端初始化成功');
                log(`URL: ${window.SUPABASE_URL}`);
                log(`Key前缀: ${window.SUPABASE_ANON_KEY.substring(0, 20)}...`);
                
                updateStatus('connection-status', '✅ 连接初始化成功', 'success');
                updateMetric('supabase-connection', '已连接');
                testStats.testResults.connection = true;
                
            } catch (error) {
                log(`连接初始化失败: ${error.message}`, 'error');
                updateStatus('connection-status', `❌ 初始化失败: ${error.message}`, 'error');
                updateMetric('supabase-connection', '失败');
                testStats.testResults.connection = false;
            }
        }

        async function testBasicConnection() {
            if (!supabaseClient) {
                log('请先初始化连接', 'warning');
                return;
            }
            
            log('测试基本数据库连接...');
            
            try {
                const { data, error } = await supabaseClient
                    .from('commands')
                    .select('count')
                    .limit(1);

                if (error) {
                    throw new Error(`数据库连接失败: ${error.message}`);
                }

                log('✅ 数据库连接测试成功');
                updateMetric('supabase-connection', '正常');
                
            } catch (error) {
                log(`数据库连接测试失败: ${error.message}`, 'error');
                updateMetric('supabase-connection', '异常');
            }
        }

        async function testChannelSubscription() {
            if (!supabaseClient) {
                log('请先初始化连接', 'warning');
                return;
            }
            
            log('测试Channel订阅功能...');
            
            try {
                const testChannel = supabaseClient.channel('test_channel_' + Date.now());
                
                const subscriptionPromise = new Promise((resolve, reject) => {
                    const timeout = setTimeout(() => {
                        reject(new Error('订阅超时'));
                    }, 10000);
                    
                    testChannel
                        .on('postgres_changes', {
                            event: 'INSERT',
                            schema: 'public',
                            table: 'commands'
                        }, (payload) => {
                            log('收到测试订阅事件');
                        })
                        .subscribe((status, err) => {
                            clearTimeout(timeout);
                            if (status === 'SUBSCRIBED') {
                                log('✅ Channel订阅成功');
                                updateMetric('channel-subscription', '正常');
                                testStats.testResults.subscription = true;
                                resolve(true);
                            } else if (status === 'CHANNEL_ERROR' || err) {
                                log(`❌ Channel订阅失败: ${status} ${err?.message || ''}`, 'error');
                                updateMetric('channel-subscription', '失败');
                                testStats.testResults.subscription = false;
                                reject(new Error(`订阅失败: ${status}`));
                            }
                        });
                });
                
                await subscriptionPromise;
                
                // 清理测试订阅
                setTimeout(() => {
                    supabaseClient.removeChannel(testChannel);
                    log('测试订阅已清理');
                }, 2000);
                
            } catch (error) {
                log(`Channel订阅测试失败: ${error.message}`, 'error');
                updateMetric('channel-subscription', '异常');
                testStats.testResults.subscription = false;
            }
        }

        async function sendTestCommand() {
            if (!supabaseClient) {
                log('请先初始化连接', 'warning');
                return;
            }
            
            const testCommand = `测试命令 - Channel Error 恢复 [${new Date().toLocaleTimeString()}]`;
            log(`发送测试命令: ${testCommand}`);
            updateStatus('command-status', '正在发送测试命令...', 'info');
            
            try {
                const { data, error } = await supabaseClient
                    .from('commands')
                    .insert([{
                        command_text: testCommand,
                        status: 'pending'
                    }])
                    .select();

                if (error) {
                    throw error;
                }

                if (data && data.length > 0) {
                    const commandId = data[0].id;
                    log(`✅ 测试命令发送成功，ID: ${commandId}`);
                    updateStatus('command-status', '✅ 测试命令发送成功', 'success');
                    testStats.commandsSent++;
                    updateMetric('commands-sent', testStats.commandsSent);
                    
                    // 模拟命令完成
                    setTimeout(async () => {
                        await simulateCommandCompletion(commandId, testCommand);
                    }, 3000);
                } else {
                    throw new Error('命令发送失败：未返回数据');
                }
                
            } catch (error) {
                log(`测试命令发送失败: ${error.message}`, 'error');
                updateStatus('command-status', `❌ 发送失败: ${error.message}`, 'error');
            }
        }

        async function simulateCommandCompletion(commandId, commandText) {
            log(`模拟命令完成: ${commandId}`);
            
            try {
                // 更新命令状态为完成
                const { error: updateError } = await supabaseClient
                    .from('commands')
                    .update({ status: 'completed' })
                    .eq('id', commandId);

                if (updateError) {
                    throw updateError;
                }

                // 插入结果
                const { error: resultError } = await supabaseClient
                    .from('results')
                    .insert([{
                        command_id: commandId,
                        result_text: `这是命令 "${commandText}" 的测试结果。Channel Error 恢复测试成功！`,
                        is_error: false
                    }]);

                if (resultError) {
                    throw resultError;
                }

                log(`✅ 命令 ${commandId} 模拟完成并插入结果`);
                
            } catch (error) {
                log(`模拟命令完成失败: ${error.message}`, 'error');
            }
        }

        async function simulateChannelError() {
            log('⚠️ 模拟Channel Error场景...', 'warning');
            updateStatus('command-status', '模拟Channel Error...', 'warning');
            
            // 这里我们不能真正模拟channel error，但可以测试fallback机制
            log('注意：实际的Channel Error需要在网络不稳定或Supabase服务问题时才会发生');
            log('建议：在网络不稳定时发送命令来测试真实的Channel Error恢复');
            
            updateStatus('command-status', '⚠️ Channel Error模拟说明已显示', 'warning');
        }

        async function testFallbackRecovery() {
            if (!supabaseClient) {
                log('请先初始化连接', 'warning');
                return;
            }
            
            log('测试Fallback恢复机制...');
            updateStatus('recovery-status', '测试Fallback恢复...', 'info');
            
            try {
                // 查询最近的已完成命令
                const { data: completedCommands, error } = await supabaseClient
                    .from('commands')
                    .select('id, command_text, status, created_at')
                    .eq('status', 'completed')
                    .order('created_at', { ascending: false })
                    .limit(5);

                if (error) {
                    throw error;
                }

                if (completedCommands && completedCommands.length > 0) {
                    log(`✅ Fallback查询成功，找到 ${completedCommands.length} 个已完成命令`);
                    updateMetric('fallback-query', '正常');
                    testStats.testResults.fallback = true;
                    
                    // 测试结果获取
                    for (const cmd of completedCommands.slice(0, 2)) {
                        const { data: results, error: resultError } = await supabaseClient
                            .from('results')
                            .select('result_text, is_error')
                            .eq('command_id', cmd.id);
                        
                        if (!resultError && results && results.length > 0) {
                            log(`✅ 成功获取命令 ${cmd.id} 的结果`);
                        } else {
                            log(`⚠️ 命令 ${cmd.id} 没有找到结果`, 'warning');
                        }
                    }
                    
                    updateStatus('recovery-status', '✅ Fallback恢复测试成功', 'success');
                } else {
                    log('⚠️ 没有找到已完成的命令用于测试', 'warning');
                    updateStatus('recovery-status', '⚠️ 没有可测试的命令', 'warning');
                }
                
            } catch (error) {
                log(`Fallback恢复测试失败: ${error.message}`, 'error');
                updateStatus('recovery-status', `❌ Fallback测试失败: ${error.message}`, 'error');
                updateMetric('fallback-query', '异常');
                testStats.testResults.fallback = false;
            }
        }

        async function testManualRecovery() {
            log('测试手动恢复功能...');
            updateStatus('recovery-status', '测试手动恢复...', 'info');
            
            try {
                // 模拟调用主应用的恢复函数
                if (typeof window.checkAndRecoverMissingResults === 'function') {
                    log('调用主应用的恢复函数...');
                    await window.checkAndRecoverMissingResults();
                    log('✅ 手动恢复功能调用成功');
                    updateMetric('manual-recovery', '正常');
                    testStats.testResults.manualRecovery = true;
                } else {
                    log('⚠️ 主应用的恢复函数不可用，测试模拟恢复逻辑', 'warning');
                    
                    // 模拟恢复逻辑
                    await testFallbackRecovery();
                    testStats.commandsRecovered++;
                    updateMetric('commands-recovered', testStats.commandsRecovered);
                    updateMetric('manual-recovery', '模拟成功');
                }
                
                updateStatus('recovery-status', '✅ 手动恢复测试完成', 'success');
                
            } catch (error) {
                log(`手动恢复测试失败: ${error.message}`, 'error');
                updateStatus('recovery-status', `❌ 手动恢复失败: ${error.message}`, 'error');
                updateMetric('manual-recovery', '异常');
                testStats.testResults.manualRecovery = false;
            }
        }

        async function testRecoveryFunction() {
            log('测试完整的结果恢复功能...');
            
            // 先发送一个测试命令
            await sendTestCommand();
            
            // 等待一段时间让命令完成
            setTimeout(async () => {
                await testFallbackRecovery();
                await testManualRecovery();
                
                log('✅ 完整恢复功能测试完成');
                updateStatus('recovery-status', '✅ 完整恢复测试完成', 'success');
            }, 5000);
        }

        async function testPageRefresh() {
            log('测试页面刷新恢复机制...');
            log('注意：页面刷新测试需要在主应用中进行');
            log('建议：在主应用中发送命令后刷新页面，观察结果是否正确恢复');
            updateStatus('recovery-status', '⚠️ 页面刷新测试需在主应用进行', 'warning');
        }

        async function clearTestData() {
            if (!supabaseClient) {
                log('请先初始化连接', 'warning');
                return;
            }
            
            if (!confirm('确定要清理测试数据吗？这将删除所有测试命令。')) {
                return;
            }
            
            log('清理测试数据...');
            
            try {
                // 删除测试命令
                const { error } = await supabaseClient
                    .from('commands')
                    .delete()
                    .ilike('command_text', '%测试命令 - Channel Error 恢复%');

                if (error) {
                    throw error;
                }

                log('✅ 测试数据清理完成');
                
                // 重置统计
                testStats = {
                    commandsSent: 0,
                    commandsRecovered: 0,
                    testResults: {}
                };
                updateMetric('commands-sent', 0);
                updateMetric('commands-recovered', 0);
                
            } catch (error) {
                log(`清理测试数据失败: ${error.message}`, 'error');
            }
        }

        // 页面加载时自动初始化
        window.addEventListener('load', () => {
            log('Channel Error 恢复测试页面已加载');
            log('请点击"初始化连接"开始测试');
        });
    </script>
</body>
</html>
