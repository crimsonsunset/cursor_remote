<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursor远程控制</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism.min.css">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css">
</head>
<body class="light-mode">
    <div class="app-container">
        <header class="app-header">
            <h1 class="app-title">Cursor远程控制</h1>
            <div class="header-actions">
                <button id="themeToggle" class="theme-toggle-button" title="切换主题">
                    <i class="ri-moon-line"></i>
                </button>
                <div class="status-indicator">
                    <span class="status-dot" id="connectionStatus"></span>
                    <span id="statusText">未连接</span>
                </div>
                <a href="https://github.com/terryso/cursor_remote" target="_blank" rel="noopener noreferrer" class="github-link">
                    <i class="ri-github-fill"></i>
                </a>
            </div>
        </header>

        <main class="main-content">
            <div class="chat-container" id="chatContainer">
                <!-- 欢迎消息 -->
                <div class="message system-message">
                    <div class="message-content">
                        <p>欢迎使用Cursor远程控制！请输入您想问Cursor的问题。</p>
                    </div>
                </div>
                <!-- 聊天内容将在这里动态添加 -->
            </div>
            
            <div class="input-wrapper">
                <div class="input-container">
                    <textarea id="messageInput" placeholder="输入您想问Cursor的问题..." rows="1"></textarea>
                    <div class="input-buttons">
                        <button id="clearButton" class="icon-button" title="清除对话">
                            <i class="ri-delete-bin-line"></i>
                        </button>
                        <button id="sendButton" class="send-button" title="发送">
                            <i class="ri-send-plane-fill"></i>
                        </button>
                    </div>
                </div>
                <div class="input-footer">
                    <span class="input-tip">支持 Markdown 和代码块</span>
                    <span class="shortcut-tip">Enter 换行 / Ctrl+Enter 发送</span>
                </div>
            </div>
        </main>
    </div>
    
    <!-- 加载动画模板 -->
    <template id="loadingTemplate">
        <div class="loading-animation">
            <div class="loading-dot"></div>
            <div class="loading-dot"></div>
            <div class="loading-dot"></div>
        </div>
    </template>
    
    <!-- 用户消息模板 -->
    <template id="userMessageTemplate">
        <div class="message user-message">
            <div class="message-content">
            </div>
            <div class="message-avatar">
                <i class="ri-user-3-fill"></i>
            </div>
        </div>
    </template>
    
    <!-- 助手消息模板 -->
    <template id="assistantMessageTemplate">
        <div class="message assistant-message">
            <div class="message-avatar">
                <i class="ri-robot-fill"></i>
            </div>
            <div class="message-content">
            </div>
            <div class="message-actions">
                <button class="copy-button" title="复制回复">
                    <i class="ri-clipboard-line"></i>
                </button>
            </div>
        </div>
    </template>
    
    <script src="env-config.js"></script>
    <script src="app.js"></script>
</body>
</html>
